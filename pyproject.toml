[project]
name = "ai-engineering"
version = "0.1.0"
description = "Semana 1-2 — Python moderno + Async para AI Engineering"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["domain*", "services*", "adapters*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true
